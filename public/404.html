<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1F2F1F" />
  <meta name="robots" content="noindex, nofollow" />
  <title>找不到這一頁 | 月島・遊戲中心</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <style>
    :root { --paper: #F5F0E8; --ink: #1F2F1F; --forest: #304F2F; --sun: #D7C678; --muted: #5F6856; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.7;
      text-align: center;
    }
    main { max-width: 26rem; }
    img { width: 140px; height: 140px; border-radius: 28px; display: block; margin: 0 auto 20px; }
    .eyebrow { margin: 0; font-size: .8rem; letter-spacing: .12em; color: var(--muted); }
    h1 { margin: 4px 0 8px; font-size: 1.6rem; line-height: 1.35; }
    p { margin: 0 0 24px; color: var(--muted); }
    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 999px;
      background: var(--forest);
      color: var(--paper);
      font-weight: 700;
      text-decoration: none;
    }
    a:hover, a:focus-visible { background: var(--ink); outline: 2px solid var(--sun); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/pwa-192x192.png" alt="" width="140" height="140" />
    <p class="eyebrow">404 · 月島・遊戲中心</p>
    <h1>找不到這一頁</h1>
    <p>這個網址目前沒有內容，可能是連結打錯了，或這一頁已經移走。回到遊戲中心，轉出今天的好運吧。</p>
    <a href="/">回到遊戲中心</a>
  </main>
</body>
</html>
